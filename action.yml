name: 'LLM code review'
description: 'Query an LLM API to create a code review'

inputs:
  backend:
    default: gh-gpt-4o
    description: "Language model to query (gemini-2.0, mistral, or gh-<GitHub Models model name> (e.g., gh-phi-4, gh-gpt-4o)"
  code-dir:
    default: "coderoot"
  api-key-variable:
    default: LLM_API_KEY
    description: "Name of variable in which API key is stored; must be set in calling workflow"
  api-key:
    description: "API key"
    default: 'empty'
  reference-owner:
    description: "Owner of authoritative branch (e.g., NOAA-EMC)"
    default: NOAA-EMC
  reference-branch:
    default: ${{ github.event.pull_request.base.ref || 'develop' }}
  context-lines:
    default: 100
  prompt-text:
    default: |
      Follow these instructions carefully. You will receive the following input:
      1. File diffs comparing the current branch with a reference branch (showing modifications in unified diff format, i.e., + and - signs showing added and removed lines)
      2. Reference source code - the complete, unmodified contents of all relevant files, labeled by filename

      Review the code modifications shown in the diffs, inferring the programming language from file extensions and syntax.
      Structure your review into markdown-formatted output with exactly these three sections:

      - Summary of Changes - Briefly describe what modifications were made across all files, based on the provided code diffs. Be careful not to review unmodified code unless it is directly relevant to the modifications shown in the file diffs.
      - Issues & Possible Errors - Identify problems with the modifications shown in the file diffs, providing specific corrections including exact line locations, missing declarations, or other changes needed elsewhere in the codebase (use the reference source code only to identify ripple effects; do not review unmodified source code). If there are inconsistencies between the code modifications and the rest of the code base and developer intent is unclear, show both/all ways of resolving a given inconsistency (e.g., for a deleted variable declaration, show how to reinsert it, but also show how to update the rest of the code to be consistent with that change in case that is the developer's intent).
      - Suggestions - Recommend better approaches for the specific modifications shown (do not suggest changes unrelated to the diffs)

      Important constraints:
      - Only identify code modifications based on lines marked with + (additions) and - (deletions) in the diffs. Diff lines without + and - signs, as well as the unmodified context file, do not represent code modifications. Contents of files not shown in the diff output should not be considered modified, and therefore should not be discussed unless directly relevant to modifications revealed by the diff output.
      - Use the reference source code to understand context and identify where additional changes may be needed. Do not discuss the reference source code unless it reveals issues with the modifications, such as if a change shown in the file diffs should be or might need to be reflected elsewhere in the code (such as the deletion of a variable).
      - Treat unmarked lines in diffs as context only - do not review them unless they reveal issues with the modifications.
      - Show exact code corrections using clear before/after format or specify precise insertion points.
      - If no issues exist in a section, state "None identified".
  github-token:
    description: "GitHub token for posting PR comments"
  save-diff-files:
    description: "Save diff files for debugging purposes"
    default: false
  time-delay-per-file:
    description: "Set time delay before going to the next file to accommodate rate limits"
    default: 6
  provide-codebase:
    description: "Put diffs in one big query, along with rest of code base for context. Won't work for some models due to input token limits."
    default: false

runs:
  using: 'composite'
  steps:

    - name: 'Checkout modified code'
      if: ${{ inputs.code-dir == 'coderoot' }}
      uses: actions/checkout@v4
      with:
        path: coderoot

    - name: 'Get diffs and run query'
      shell: bash
      run: |
        if [ "${{ inputs.api-key }}" != 'empty' ]; then
          export ${{ inputs.api-key-variable }}=${{ inputs.api-key }}
        fi
        sudo apt-get --quiet install pandoc
        cd ${{ inputs.code-dir }}
        mkdir reviews
        echo "Getting list of differing files compared with reference URL/branch"
        git remote add reference https://github.com/${{ inputs.reference-owner }}/${{ github.event.repository.name }}
        git remote update reference
        diff_files=$(git diff --name-only reference/${{ inputs.reference-branch }} HEAD)
        echo "Getting diff for each file and querying LLM API"
        if [ ${{ inputs.provide-codebase }} != false ]; then
          echo -e "${{ inputs.prompt-text }}" > query.txt
          #echo -e "After the diff-formatted modifications by file, the entire unmodified codebase, labeled by file, has been provided for context. Please identify any instances where modifications have not been appropriately applied throughout the codebase.\n\n" >> query.txt
          git diff --no-prefix reference/${{ inputs.reference-branch }} HEAD >> query.txt
          echo -e "\nThe following is the raw source code, provided only for context. Do not review or discuss this code unless directly relevant to the code modifications shown in the above diff output.\n" >> query.txt
          git ls-tree -r --name-only reference/${{ inputs.reference-branch }} -- src/ | while read -r f; do   git show "reference/${{ inputs.reference-branch }}:$f" | file --mime - | grep -q text && echo "=== $f ===" && git show "reference/${{ inputs.reference-branch }}:$f"; done &>> query.txt
          ${{ github.action_path }}/query_llm_api.py query.txt review.md --backend ${{ inputs.backend }} --key-variable ${{ inputs.api-key-variable }}
          pandoc -f commonmark review.md -o review.html
          cp review.html reviews/.
          if [ "${{ inputs.save-diff-files }}" == true ]; then
            mkdir -p ${GITHUB_WORKSPACE}/diffs
            cp query.txt ${GITHUB_WORKSPACE}/diffs/.
          fi
        else
          for file in $diff_files ; do
            if [ ! -f $file ]; then continue ; fi
            filetype=$(file -b $file)
            if [[ " $filetype " =~ " data " ]]; then continue ; fi
            echo -e "${{ inputs.prompt-text }}" > ${file}.diff
            git diff --no-prefix -U${{ inputs.context-lines }} reference/${{ inputs.reference-branch }} HEAD -- $file >> ${file}.diff
            if [ "${{ inputs.save-diff-files }}" == true ]; then
              mkdir -p ${GITHUB_WORKSPACE}/diffs
              cp ${file}.diff ${GITHUB_WORKSPACE}/diffs/.
            fi
            ${{ github.action_path }}/query_llm_api.py ${file}.diff ${file}.review --backend ${{ inputs.backend }} --key-variable ${{ inputs.api-key-variable }}
            pandoc -f commonmark ${file}.review -o ${file}.review.html
            mv ${file}.review.html reviews/.
            echo "Processed ${file}"
            sleep ${{ inputs.time-delay-per-file }}
          done
        fi

    - name: 'Upload reviews as artifact'
      id: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.backend }}-code-reviews-${{ github.event.repository.name }}-${{ github.sha }}-${{ inputs.reference-branch }}
        path: ${{ inputs.code-dir }}/reviews/

    - name: 'Upload diffs as artifact'
      id: upload-diffs-artifact
      uses: actions/upload-artifact@v4
      if: ${{ inputs.save-diff-files == 'true' }}
      with:
        name: ${{ inputs.backend }}-diffs-${{ github.event.repository.name }}-${{ github.sha }}-${{ inputs.reference-branch }}
        path: ${{ github.workspace }}/diffs

    - name: 'Comment PR'
      if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Here is an artifact with your automated ${{ inputs.backend }} code review (commit ${{ github.sha }}): ${{ steps.upload-artifact.outputs.artifact-url }}'
          })
